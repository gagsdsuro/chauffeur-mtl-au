services:
  chauffeur-mtl-au:
    build:
      context: .
      args:
        # Alignés sur l'UID/GID de l'hôte pour que les fichiers générés
        # dans ./data appartiennent à l'utilisateur, pas à root.
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    # Sécurité supplémentaire au cas où l'image serait construite ailleurs.
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      # Lié à la boucle locale : placer un reverse-proxy HTTPS devant pour tout autre accès.
      - "127.0.0.1:8501:8501"
    volumes:
      # Les données JSON, PDFs et GTFS restent sur l'hôte
      - ./data:/app/data
      # La config secrets (clé API GTFS-RT) reste sur l'hôte
      - ./Installation:/app/Installation
    environment:
      - TZ=America/Toronto
      - CHAUFFEUR_MATRICULE=${CHAUFFEUR_MATRICULE:-}
      - CHAUFFEUR_MODE_STRICT=${CHAUFFEUR_MODE_STRICT:-0}
    restart: unless-stopped
    labels:
      # Configuration Traefik (si utilisé comme reverse proxy)
      # Router pour /static/* : cache agressif (les fichiers ont des hashes)
      - "traefik.enable=true"
      - "traefik.http.routers.chauffeur-static.rule=Host(`chauffeur.gagsnet.net`) && PathPrefix(`/static/`)"
      - "traefik.http.routers.chauffeur-static.entrypoints=websecure"
      - "traefik.http.routers.chauffeur-static.tls=true"
      - "traefik.http.routers.chauffeur-static.priority=10"
      - "traefik.http.routers.chauffeur-static.middlewares=chauffeur-cache-static"
      - "traefik.http.middlewares.chauffeur-cache-static.headers.customresponseheaders.Cache-Control=public, max-age=31536000, immutable"
      # Router principal : pas de cache (HTML et autres)
      - "traefik.http.routers.chauffeur.rule=Host(`chauffeur.gagsnet.net`)"
      - "traefik.http.routers.chauffeur.entrypoints=websecure"
      - "traefik.http.routers.chauffeur.tls=true"
      - "traefik.http.routers.chauffeur.priority=1"
      - "traefik.http.routers.chauffeur.middlewares=chauffeur-nocache"
      - "traefik.http.middlewares.chauffeur-nocache.headers.customresponseheaders.Cache-Control=no-cache, no-store, must-revalidate"
      - "traefik.http.middlewares.chauffeur-nocache.headers.customresponseheaders.Pragma=no-cache"
      - "traefik.http.middlewares.chauffeur-nocache.headers.customresponseheaders.Expires=0"
      # Service commun
      - "traefik.http.services.chauffeur.loadbalancer.server.port=8501"
