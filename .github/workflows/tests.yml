name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les dépendances (empreintes vérifiées)
        run: |
          python -m pip install --require-hashes -r requirements.txt
          python -m pip check
      - name: Suite de tests
        run: python3 tests/run_all.py
      - name: Garde-fou Docker
        run: python3 tests/test_dockerfile.py
